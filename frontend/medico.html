<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HospTech | Médico</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
  ">

    <h2 style="margin:0;">
      🩺 Painel Médico
    </h2>

    <button
      class="btn-abrir-tv"
      onclick="window.open('tv.html','_blank')"
    >
      📺 Abrir TV
    </button>

  </div>

  <div class="consultorio-input">

    <label>
      Meu Consultório:
    </label>

    <input
      type="text"
      id="consultorio-num"
      value="01"
      maxlength="3"
    >

    <span style="
      color:#9485a8;
      font-size:12px;
    ">
      Número exibido na TV ao chamar o paciente.
    </span>

  </div>

  <h3>Pacientes aguardando atendimento</h3>

  <div id="triagens"></div>

  <hr>

  <h3>Consulta</h3>

  <input
    id="paciente"
    placeholder="Paciente"
    readonly
  >

  <input
    id="diagnostico"
    placeholder="Diagnóstico"
  >

  <select id="medicacao">

    <option value="">
      Selecione a medicação
    </option>

  </select>

  <textarea
    id="obs"
    placeholder="Observações"
  ></textarea>

  <button onclick="salvar()">
    Salvar Consulta
  </button>

</div>

<script>

let triagensCarregadas = [];

async function carregar() {

  try {

    const response =
      await fetch("/triagens");

    const data =
      await response.json();

    triagensCarregadas = data;

    const div =
      document.getElementById("triagens");

    div.innerHTML = "";

    const fila =
      data.filter(
        t =>
          t.status ===
          "aguardando_medico"
      );

    if (fila.length === 0) {

      div.innerHTML = `
        <p style="text-align:center;">
          Nenhum paciente aguardando atendimento.
        </p>
      `;

      return;
    }

    fila.forEach((t, index) => {

      div.innerHTML += `

        <div class="card">

          <h3>
            ${escapeHTML(t.nome)}
          </h3>

          <p>
            <b>Sintoma:</b>
            ${escapeHTML(
              t.sintoma || "Não informado"
            )}
          </p>

          <p>
            <b>Temperatura:</b>
            ${
              t.temperatura ??
              "Não informada"
            }°C
          </p>

          <p>
            <span class="${t.risco}">
              ${escapeHTML(t.risco)}
            </span>
          </p>

          <p>
            <b>Alergia:</b>
            ${escapeHTML(
              t.alergia || "Nenhuma"
            )}
          </p>

          <p>
            <b>Observação:</b>
            ${escapeHTML(
              t.observacao || "Nenhuma"
            )}
          </p>

          <div style="
            display:flex;
            gap:8px;
            flex-wrap:wrap;
          ">

            <button
              onclick="selecionar(${index})"
            >
              Atender
            </button>

            <button
              class="btn-tv"
              onclick="chamarNaTV('${escapeJS(t.nome)}')"
            >
              📺 Chamar na TV
            </button>

          </div>

        </div>

      `;

    });

  } catch (error) {

    document.getElementById(
      "triagens"
    ).innerHTML = `
      <p style="color:#f87171;">
        Erro ao carregar triagens.
      </p>
    `;

  }

}

async function chamarNaTV(nome) {

  const consultorio =
    document.getElementById(
      "consultorio-num"
    ).value.trim() || "01";

  try {

    const response =
      await fetch("/tv/chamar", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          localTipo: "CONSULTÓRIO",

          localNumero: consultorio,

          paciente: nome

        })

      });

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.erro || "Erro ao chamar paciente."
      );
    }

    alert(
      "📺 " +
      nome +
      " foi chamado para o Consultório " +
      consultorio +
      "."
    );

  } catch (error) {

    alert(error.message);

  }

}

async function selecionar(index) {

  const t =
    triagensCarregadas[index];

  if (!t) return;

  document.getElementById(
    "paciente"
  ).value = t.nome;

  document.getElementById(
    "obs"
  ).value = t.observacao || "";

  try {

    await fetch(
      `/pacientes/${encodeURIComponent(t.id)}/status`,
      {
        method: "PATCH",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          status: "em_atendimento"
        })
      }
    );

  } catch (error) {

    console.error(
      "Erro ao atualizar status:",
      error
    );

  }

  if (
    t.alergia &&
    t.alergia !== "Nenhuma"
  ) {

    alert(
      "⚠️ Paciente possui alergia: " +
      t.alergia
    );

  }

}

async function carregarMedicacoes() {

  try {

    const response =
      await fetch(
        "/lista-medicacoes"
      );

    const data =
      await response.json();

    const select =
      document.getElementById(
        "medicacao"
      );

    select.innerHTML = `
      <option value="">
        Selecione a medicação
      </option>
    `;

    data.forEach(med => {

      const option =
        document.createElement(
          "option"
        );

      option.value = med;

      option.textContent = med;

      select.appendChild(option);

    });

  } catch (error) {

    console.error(
      "Erro ao carregar medicações:",
      error
    );

  }

}

async function salvar() {

  const paciente =
    document.getElementById(
      "paciente"
    ).value.trim();

  const diagnostico =
    document.getElementById(
      "diagnostico"
    ).value.trim();

  const medicacao =
    document.getElementById(
      "medicacao"
    ).value;

  const obs =
    document.getElementById(
      "obs"
    ).value.trim();

  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;
  }

  if (!diagnostico) {

    alert(
      "Informe o diagnóstico."
    );

    return;
  }

  if (!medicacao) {

    alert(
      "Selecione uma medicação."
    );

    return;
  }

  try {

    const response =
      await fetch("/consulta", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          paciente,
          diagnostico,
          medicacao,
          obs
        })

      });

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.erro ||
        "Erro ao salvar consulta."
      );
    }

    alert(
      "✅ Consulta salva com sucesso!"
    );

    document.getElementById(
      "paciente"
    ).value = "";

    document.getElementById(
      "diagnostico"
    ).value = "";

    document.getElementById(
      "medicacao"
    ).value = "";

    document.getElementById(
      "obs"
    ).value = "";

    carregar();

  } catch (error) {

    alert(error.message);

  }

}

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

function escapeJS(value) {

  return String(value)
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'")
    .replaceAll("\n", "\\n")
    .replaceAll("\r", "\\r");

}

carregar();

carregarMedicacoes();

setInterval(
  carregar,
  10000
);

</script>

</body>
</html>
