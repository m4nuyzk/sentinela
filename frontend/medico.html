<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HospTech | Médico</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<div class="container">

  <div class="page-header">

    <div class="page-title">

      <div class="page-title-icon">
        🩺
      </div>

      <div>

        <h2>Painel médico</h2>

        <p>
          Gerencie os pacientes e registre as consultas.
        </p>

      </div>

    </div>

    <button
      class="btn-abrir-tv"
      onclick="window.open('tv.html','_blank')"
    >
      📺 Abrir TV
    </button>

  </div>

  <div class="consultorio-input">

    <label for="consultorio-num">
      Consultório:
    </label>

    <input
      type="text"
      id="consultorio-num"
      value="01"
      maxlength="3"
    >

    <span>
      Número exibido na chamada do paciente.
    </span>

  </div>

  <div class="medico-layout">

    <!-- FILA -->

    <section class="panel">

      <div class="panel-header">

        <h3>
          Pacientes aguardando
        </h3>

      </div>

      <div id="triagens">

        <div class="empty-state">
          Carregando pacientes...
        </div>

      </div>

    </section>

    <!-- CONSULTA -->

    <section class="panel">

      <div class="panel-header">

        <h3>
          Registro da consulta
        </h3>

      </div>

      <div class="form-group">

        <label for="paciente">
          Paciente
        </label>

        <input
          id="paciente"
          placeholder="Selecione um paciente"
          readonly
        >

      </div>

      <div
        class="form-group"
        style="margin-top:15px;"
      >

        <label for="diagnostico">
          Diagnóstico
        </label>

        <input
          id="diagnostico"
          placeholder="Informe o diagnóstico"
        >

      </div>

      <div
        class="form-group"
        style="margin-top:15px;"
      >

        <label for="medicacao">
          Medicação
        </label>

        <select id="medicacao">

          <option value="">
            Selecione a medicação
          </option>

        </select>

      </div>

      <div
        class="form-group"
        style="margin-top:15px;"
      >

        <label for="obs">
          Observações
        </label>

        <textarea
          id="obs"
          placeholder="Observações da consulta..."
        ></textarea>

      </div>

      <button onclick="salvar()">
        Salvar consulta
      </button>

    </section>

  </div>

</div>

<script>

let filaAtual = [];

async function carregar() {

  const div =
    document.getElementById(
      "triagens"
    );

  try {

    const response =
      await fetch("/triagens");

    const data =
      await response.json();

    filaAtual =
      data.filter(
        t =>
          t.status ===
          "aguardando_medico"
      );

    if (
      filaAtual.length === 0
    ) {

      div.innerHTML = `
        <div class="empty-state">
          Nenhum paciente aguardando atendimento.
        </div>
      `;

      return;
    }

    div.innerHTML = "";

    filaAtual.forEach(
      (t, index) => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "card";

        const temperatura =
          t.temperatura !== ""
            ? `${t.temperatura}°C`
            : "Não informada";

        card.innerHTML = `

          <h3>
            ${escapeHTML(t.nome)}
          </h3>

          <p>
            <strong>
              Sintoma:
            </strong>
            ${escapeHTML(
              t.sintoma ||
              "Não informado"
            )}
          </p>

          <p>
            <strong>
              Temperatura:
            </strong>
            ${escapeHTML(
              temperatura
            )}
          </p>

          <p>
            <span class="${t.risco}">
              ${escapeHTML(
                t.risco ||
                "verde"
              )}
            </span>
          </p>

          <p>
            <strong>
              Alergia:
            </strong>
            ${escapeHTML(
              t.alergia ||
              "Nenhuma informada"
            )}
          </p>

          <p>
            <strong>
              Observação:
            </strong>
            ${escapeHTML(
              t.observacao ||
              "Nenhuma"
            )}
          </p>

          <div class="card-actions">

            <button
              onclick="selecionar(${index})"
            >
              Atender paciente
            </button>

            <button
              class="btn-tv"
              onclick="chamarNaTV('${escapeJS(t.nome)}')"
            >
              📺 Chamar na TV
            </button>

          </div>

        `;

        div.appendChild(
          card
        );
      }
    );

  } catch (error) {

    div.innerHTML = `
      <div class="vermelho">
        Erro ao carregar triagens.
      </div>
    `;
  }
}

async function selecionar(index) {

  const t =
    filaAtual[index];

  if (!t) {
    return;
  }

  document.getElementById(
    "paciente"
  ).value = t.nome;

  document.getElementById(
    "obs"
  ).value =
    t.observacao || "";

  if (t.pacienteId) {

    try {

      await fetch(
        `/pacientes/${t.pacienteId}/status`,
        {

          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              status:
                "em_atendimento"
            })
        }
      );

    } catch (error) {

      console.error(
        "Erro ao atualizar status:",
        error
      );
    }

  } else {

    // Compatibilidade com triagens antigas

    try {

      const pacientesResponse =
        await fetch(
          "/pacientes"
        );

      const pacientes =
        await pacientesResponse.json();

      const paciente =
        [...pacientes]
          .reverse()
          .find(
            p =>
              p.nome &&
              p.nome.toLowerCase() ===
                t.nome.toLowerCase()
          );

      if (paciente) {

        await fetch(
          `/pacientes/${paciente.id}/status`,
          {

            method: "PATCH",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                status:
                  "em_atendimento"
              })
          }
        );
      }

    } catch (error) {

      console.error(error);
    }
  }

  if (
    t.alergia &&
    t.alergia.toLowerCase() !==
      "nenhuma"
  ) {

    alert(
      `⚠️ Atenção: paciente possui alergia a ${t.alergia}.`
    );
  }

  carregar();
}

async function chamarNaTV(nome) {

  const consultorio =
    document
      .getElementById(
        "consultorio-num"
      )
      .value
      .trim() || "01";

  try {

    const response =
      await fetch(
        "/tv/chamar",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              localTipo:
                "CONSULTÓRIO",

              localNumero:
                consultorio,

              paciente:
                nome
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.erro ||
        "Erro ao chamar paciente."
      );
    }

    alert(
      `${nome} foi chamado para o Consultório ${consultorio}.`
    );

  } catch (error) {

    alert(
      error.message
    );
  }
}

async function carregarMedicacoes() {

  try {

    const response =
      await fetch(
        "/lista-medicacoes"
      );

    const data =
      await response.json();

    const select =
      document.getElementById(
        "medicacao"
      );

    select.innerHTML = `
      <option value="">
        Selecione a medicação
      </option>
    `;

    data.forEach(
      med => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          med;

        option.textContent =
          med;

        select.appendChild(
          option
        );
      }
    );

  } catch (error) {

    console.error(
      "Erro ao carregar medicações:",
      error
    );
  }
}

async function salvar() {

  const paciente =
    document
      .getElementById(
        "paciente"
      )
      .value
      .trim();

  const diagnostico =
    document
      .getElementById(
        "diagnostico"
      )
      .value
      .trim();

  const medicacao =
    document
      .getElementById(
        "medicacao"
      )
      .value;

  const obs =
    document
      .getElementById(
        "obs"
      )
      .value
      .trim();

  if (!paciente) {

    alert(
      "Selecione um paciente."
    );

    return;
  }

  if (!diagnostico) {

    alert(
      "Informe o diagnóstico."
    );

    return;
  }

  if (!medicacao) {

    alert(
      "Selecione uma medicação."
    );

    return;
  }

  try {

    const response =
      await fetch(
        "/consulta",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              paciente,

              diagnostico,

              medicacao,

              obs
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.erro ||
        "Erro ao salvar consulta."
      );
    }

    alert(
      "Consulta registrada com sucesso!"
    );

    document.getElementById(
      "paciente"
    ).value = "";

    document.getElementById(
      "diagnostico"
    ).value = "";

    document.getElementById(
      "medicacao"
    ).value = "";

    document.getElementById(
      "obs"
    ).value = "";

    carregar();

  } catch (error) {

    alert(
      error.message
    );
  }
}

function escapeHTML(value) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

function escapeJS(value) {

  return String(value)
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    )
    .replaceAll(
      "\n",
      "\\n"
    )
    .replaceAll(
      "\r",
      "\\r"
    );
}

carregar();

carregarMedicacoes();

setInterval(
  carregar,
  10000
);

</script>

</body>

</html>
