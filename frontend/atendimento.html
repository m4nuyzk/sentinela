<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HospTech | Atendimento</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<div class="container">

  <div class="page-header">

    <div class="page-title">

      <div class="page-title-icon">
        👤
      </div>

      <div>

        <h2>Cadastro de paciente</h2>

        <p>
          Registre os dados para iniciar o atendimento.
        </p>

      </div>

    </div>

  </div>

  <!-- DADOS PESSOAIS -->

  <section class="form-section">

    <h3 class="form-section-title">

      <span>👤</span>

      Dados pessoais

    </h3>

    <div class="form-grid">

      <div class="form-group full">

        <label for="nome">
          Nome completo
        </label>

        <input
          id="nome"
          type="text"
          placeholder="Digite o nome completo"
          autocomplete="name"
        >

      </div>

      <div class="form-group">

        <label for="cpf">
          CPF
        </label>

        <input
          id="cpf"
          type="text"
          placeholder="000.000.000-00"
          maxlength="14"
        >

      </div>

      <div class="form-group">

        <label for="rg">
          RG
        </label>

        <input
          id="rg"
          type="text"
          placeholder="Número do RG"
          maxlength="20"
        >

      </div>

      <div class="form-group">

        <label for="outroDocumento">
          Outro documento
        </label>

        <input
          id="outroDocumento"
          type="text"
          placeholder="Opcional"
        >

      </div>

      <div class="form-group">

        <label for="dataNascimento">
          Data de nascimento
        </label>

        <input
          id="dataNascimento"
          type="date"
        >

      </div>

      <div class="form-group">

        <label for="sexo">
          Sexo
        </label>

        <select id="sexo">

          <option value="">
            Selecione
          </option>

          <option value="Feminino">
            Feminino
          </option>

          <option value="Masculino">
            Masculino
          </option>

          <option value="Outro">
            Outro
          </option>

          <option value="Nao informado">
            Prefiro não informar
          </option>

        </select>

      </div>

      <div class="form-group">

        <label for="estadoCivil">
          Estado civil
        </label>

        <select id="estadoCivil">

          <option value="">
            Selecione
          </option>

          <option value="Solteiro">
            Solteiro(a)
          </option>

          <option value="Casado">
            Casado(a)
          </option>

          <option value="Divorciado">
            Divorciado(a)
          </option>

          <option value="Viuvo">
            Viúvo(a)
          </option>

          <option value="Uniao estavel">
            União estável
          </option>

        </select>

      </div>

      <div class="form-group full">

        <label for="nomeMae">
          Nome da mãe
        </label>

        <input
          id="nomeMae"
          type="text"
          placeholder="Nome completo da mãe"
        >

      </div>

    </div>

  </section>

  <!-- CONTATO -->

  <section class="form-section">

    <h3 class="form-section-title">

      <span>📞</span>

      Contato

    </h3>

    <div class="form-grid">

      <div class="form-group">

        <label for="telefone">
          Telefone
        </label>

        <input
          id="telefone"
          type="tel"
          placeholder="(00) 00000-0000"
          autocomplete="tel"
        >

      </div>

      <div class="form-group">

        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          type="email"
          placeholder="paciente@email.com"
          autocomplete="email"
        >

      </div>

      <div class="form-group full">

        <label for="contatoEmergencia">
          Contato de emergência
        </label>

        <input
          id="contatoEmergencia"
          type="text"
          placeholder="Nome e telefone para contato"
        >

      </div>

    </div>

  </section>

  <!-- ENDEREÇO -->

  <section class="form-section">

    <h3 class="form-section-title">

      <span>📍</span>

      Endereço

    </h3>

    <div class="form-grid">

      <div class="form-group full">

        <label for="endereco">
          Endereço completo
        </label>

        <input
          id="endereco"
          type="text"
          placeholder="Rua, número, bairro, cidade..."
          autocomplete="street-address"
        >

      </div>

    </div>

  </section>

  <!-- ATENDIMENTO -->

  <section class="form-section">

    <h3 class="form-section-title">

      <span>🏥</span>

      Atendimento

    </h3>

    <div class="form-grid">

      <div class="form-group">

        <label for="tipo">
          Tipo de atendimento
        </label>

        <select id="tipo">

          <option value="">
            Selecione
          </option>

          <option value="Convenio">
            Convênio
          </option>

          <option value="Particular">
            Particular
          </option>

        </select>

      </div>

      <div class="form-group">

        <label for="foto">
          Foto do paciente
        </label>

        <input
          type="file"
          id="foto"
          accept="image/*"
        >

      </div>

    </div>

  </section>

  <div id="resultado"></div>

  <button onclick="cadastrar()">
    Cadastrar paciente
  </button>

</div>

<script>

async function cadastrar() {

  const campos = {

    nome:
      document
        .getElementById("nome")
        .value
        .trim(),

    cpf:
      document
        .getElementById("cpf")
        .value
        .trim(),

    rg:
      document
        .getElementById("rg")
        .value
        .trim(),

    outroDocumento:
      document
        .getElementById("outroDocumento")
        .value
        .trim(),

    dataNascimento:
      document
        .getElementById("dataNascimento")
        .value,

    sexo:
      document
        .getElementById("sexo")
        .value,

    nomeMae:
      document
        .getElementById("nomeMae")
        .value
        .trim(),

    estadoCivil:
      document
        .getElementById("estadoCivil")
        .value,

    endereco:
      document
        .getElementById("endereco")
        .value
        .trim(),

    telefone:
      document
        .getElementById("telefone")
        .value
        .trim(),

    email:
      document
        .getElementById("email")
        .value
        .trim(),

    contatoEmergencia:
      document
        .getElementById("contatoEmergencia")
        .value
        .trim(),

    tipo:
      document
        .getElementById("tipo")
        .value
  };

  const fotoInput =
    document.getElementById("foto");

  const resultado =
    document.getElementById("resultado");

  resultado.className = "";
  resultado.innerText = "";

  const obrigatorios = [
    campos.nome,
    campos.cpf,
    campos.rg,
    campos.dataNascimento,
    campos.sexo,
    campos.nomeMae,
    campos.estadoCivil,
    campos.endereco,
    campos.telefone,
    campos.email,
    campos.contatoEmergencia,
    campos.tipo
  ];

  if (
    obrigatorios.some(
      valor => !valor
    )
  ) {

    resultado.className =
      "vermelho";

    resultado.innerText =
      "Preencha todos os campos obrigatórios.";

    return;
  }

  const emailValido =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (
    !emailValido.test(
      campos.email
    )
  ) {

    resultado.className =
      "vermelho";

    resultado.innerText =
      "Digite um e-mail válido.";

    return;
  }

  let foto = null;

  if (fotoInput.files.length > 0) {

    const arquivo =
      fotoInput.files[0];

    if (
      !arquivo.type.startsWith(
        "image/"
      )
    ) {

      resultado.className =
        "vermelho";

      resultado.innerText =
        "Selecione uma imagem válida.";

      return;
    }

    if (
      arquivo.size >
      5 * 1024 * 1024
    ) {

      resultado.className =
        "vermelho";

      resultado.innerText =
        "A foto deve ter no máximo 5 MB.";

      return;
    }

    foto =
      await converterImagem(
        arquivo
      );
  }

  try {

    const response =
      await fetch(
        "/atendimento",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              ...campos,
              foto
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.erro ||
        "Erro ao cadastrar paciente."
      );
    }

    resultado.className =
      "verde";

    resultado.innerText =
      "Paciente cadastrado com sucesso e encaminhado para a triagem.";

    limparFormulario();

  } catch (error) {

    resultado.className =
      "vermelho";

    resultado.innerText =
      error.message;
  }
}

function limparFormulario() {

  [
    "nome",
    "cpf",
    "rg",
    "outroDocumento",
    "dataNascimento",
    "sexo",
    "nomeMae",
    "estadoCivil",
    "endereco",
    "telefone",
    "email",
    "contatoEmergencia",
    "tipo"
  ].forEach(id => {

    document.getElementById(
      id
    ).value = "";

  });

  document.getElementById(
    "foto"
  ).value = "";
}

function converterImagem(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload = () =>
        resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );
    }
  );
}

// ==========================================
// CPF
// ==========================================

document
  .getElementById("cpf")
  .addEventListener(
    "input",
    function () {

      let valor =
        this.value
          .replace(/\D/g, "")
          .substring(0, 11);

      valor =
        valor.replace(
          /(\d{3})(\d)/,
          "$1.$2"
        );

      valor =
        valor.replace(
          /(\d{3})(\d)/,
          "$1.$2"
        );

      valor =
        valor.replace(
          /(\d{3})(\d{1,2})$/,
          "$1-$2"
        );

      this.value = valor;
    }
  );

// ==========================================
// TELEFONE
// ==========================================

document
  .getElementById("telefone")
  .addEventListener(
    "input",
    function () {

      let valor =
        this.value
          .replace(/\D/g, "")
          .substring(0, 11);

      if (
        valor.length <= 10
      ) {

        valor =
          valor.replace(
            /^(\d{2})(\d)/,
            "($1) $2"
          );

        valor =
          valor.replace(
            /(\d{4})(\d)/,
            "$1-$2"
          );

      } else {

        valor =
          valor.replace(
            /^(\d{2})(\d)/,
            "($1) $2"
          );

        valor =
          valor.replace(
            /(\d{5})(\d)/,
            "$1-$2"
          );
      }

      this.value = valor;
    }
  );

</script>

</body>

</html>
