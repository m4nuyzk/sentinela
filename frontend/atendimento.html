<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HospTech | Atendimento</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

  <h2>👤 Atendimento</h2>

  <p>
    Cadastre o paciente para enviá-lo à fila de triagem.
  </p>

  <!-- DADOS PESSOAIS -->

  <h3>Dados pessoais</h3>

  <input
    id="nome"
    type="text"
    placeholder="Nome completo"
    autocomplete="name"
  >

  <input
    id="cpf"
    type="text"
    placeholder="CPF"
    maxlength="14"
  >

  <input
    id="rg"
    type="text"
    placeholder="RG"
    maxlength="20"
  >

  <input
    id="outroDocumento"
    type="text"
    placeholder="Outro documento"
  >

  <label for="dataNascimento">
    Data de nascimento
  </label>

  <input
    id="dataNascimento"
    type="date"
  >

  <select id="sexo">

    <option value="">
      Sexo
    </option>

    <option value="Feminino">
      Feminino
    </option>

    <option value="Masculino">
      Masculino
    </option>

    <option value="Outro">
      Outro
    </option>

    <option value="Nao informado">
      Prefiro não informar
    </option>

  </select>

  <input
    id="nomeMae"
    type="text"
    placeholder="Nome da mãe"
  >

  <select id="estadoCivil">

    <option value="">
      Estado civil
    </option>

    <option value="Solteiro">
      Solteiro(a)
    </option>

    <option value="Casado">
      Casado(a)
    </option>

    <option value="Divorciado">
      Divorciado(a)
    </option>

    <option value="Viuvo">
      Viúvo(a)
    </option>

    <option value="Uniao estavel">
      União estável
    </option>

  </select>


  <!-- CONTATO -->

  <h3>Contato</h3>

  <input
    id="telefone"
    type="tel"
    placeholder="Telefone"
    autocomplete="tel"
  >

  <input
    id="email"
    type="email"
    placeholder="E-mail"
    autocomplete="email"
  >

  <input
    id="contatoEmergencia"
    type="text"
    placeholder="Contato de emergência"
  >


  <!-- ENDEREÇO -->

  <h3>Endereço</h3>

  <input
    id="endereco"
    type="text"
    placeholder="Endereço completo"
    autocomplete="street-address"
  >


  <!-- ATENDIMENTO -->

  <h3>Atendimento</h3>

  <select id="tipo">

    <option value="">
      Tipo de atendimento
    </option>

    <option value="Convenio">
      Convênio
    </option>

    <option value="Particular">
      Particular
    </option>

  </select>


  <!-- FOTO -->

  <h3>Foto do paciente</h3>

  <input
    type="file"
    id="foto"
    accept="image/*"
  >


  <button onclick="cadastrar()">
    Cadastrar paciente
  </button>

  <div id="resultado"></div>

</div>


<script>

async function cadastrar() {

  const nome =
    document.getElementById("nome").value.trim();

  const cpf =
    document.getElementById("cpf").value.trim();

  const rg =
    document.getElementById("rg").value.trim();

  const outroDocumento =
    document
      .getElementById("outroDocumento")
      .value
      .trim();

  const dataNascimento =
    document
      .getElementById("dataNascimento")
      .value;

  const sexo =
    document.getElementById("sexo").value;

  const nomeMae =
    document
      .getElementById("nomeMae")
      .value
      .trim();

  const estadoCivil =
    document
      .getElementById("estadoCivil")
      .value;

  const endereco =
    document
      .getElementById("endereco")
      .value
      .trim();

  const telefone =
    document
      .getElementById("telefone")
      .value
      .trim();

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const contatoEmergencia =
    document
      .getElementById("contatoEmergencia")
      .value
      .trim();

  const tipo =
    document.getElementById("tipo").value;

  const fotoInput =
    document.getElementById("foto");

  const resultado =
    document.getElementById("resultado");


  resultado.innerHTML = "";


  // VALIDAÇÃO DOS CAMPOS OBRIGATÓRIOS

  if (
    !nome ||
    !cpf ||
    !rg ||
    !dataNascimento ||
    !sexo ||
    !nomeMae ||
    !estadoCivil ||
    !endereco ||
    !telefone ||
    !email ||
    !contatoEmergencia ||
    !tipo
  ) {

    resultado.className = "vermelho";

    resultado.innerText =
      "Preencha todos os campos obrigatórios.";

    return;

  }


  // VALIDAÇÃO DO E-MAIL

  const emailValido =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (!emailValido.test(email)) {

    resultado.className = "vermelho";

    resultado.innerText =
      "Digite um e-mail válido.";

    return;

  }


  // FOTO

  let foto = null;

  if (fotoInput.files.length > 0) {

    const arquivo =
      fotoInput.files[0];


    if (!arquivo.type.startsWith("image/")) {

      resultado.className = "vermelho";

      resultado.innerText =
        "Selecione uma imagem válida.";

      return;

    }


    // Limite de 5 MB

    if (arquivo.size > 5 * 1024 * 1024) {

      resultado.className = "vermelho";

      resultado.innerText =
        "A foto deve ter no máximo 5 MB.";

      return;

    }


    foto =
      await converterImagem(arquivo);

  }


  // ENVIO PARA O BACKEND

  try {

    const response =
      await fetch(
        "/atendimento",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              nome,

              cpf,

              rg,

              outroDocumento,

              dataNascimento,

              sexo,

              nomeMae,

              estadoCivil,

              endereco,

              telefone,

              email,

              contatoEmergencia,

              tipo,

              foto

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.erro ||
        "Erro ao cadastrar paciente."
      );

    }


    // SUCESSO

    resultado.className = "verde";

    resultado.innerText =
      "Paciente cadastrado e enviado para a triagem.";


    // LIMPAR FORMULÁRIO

    document.getElementById("nome").value = "";

    document.getElementById("cpf").value = "";

    document.getElementById("rg").value = "";

    document
      .getElementById("outroDocumento")
      .value = "";

    document
      .getElementById("dataNascimento")
      .value = "";

    document
      .getElementById("sexo")
      .value = "";

    document
      .getElementById("nomeMae")
      .value = "";

    document
      .getElementById("estadoCivil")
      .value = "";

    document
      .getElementById("endereco")
      .value = "";

    document
      .getElementById("telefone")
      .value = "";

    document
      .getElementById("email")
      .value = "";

    document
      .getElementById("contatoEmergencia")
      .value = "";

    document
      .getElementById("tipo")
      .value = "";

    fotoInput.value = "";


  } catch (error) {

    resultado.className = "vermelho";

    resultado.innerText =
      error.message;

  }

}


// CONVERTER FOTO PARA BASE64

function converterImagem(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload = () =>
        resolve(reader.result);

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}


// MÁSCARA DE CPF

document
  .getElementById("cpf")
  .addEventListener(
    "input",
    function () {

      let valor =
        this.value
          .replace(/\D/g, "")
          .substring(0, 11);

      valor =
        valor.replace(
          /(\d{3})(\d)/,
          "$1.$2"
        );

      valor =
        valor.replace(
          /(\d{3})(\d)/,
          "$1.$2"
        );

      valor =
        valor.replace(
          /(\d{3})(\d{1,2})$/,
          "$1-$2"
        );

      this.value = valor;

    }
  );


// MÁSCARA DE TELEFONE

document
  .getElementById("telefone")
  .addEventListener(
    "input",
    function () {

      let valor =
        this.value
          .replace(/\D/g, "")
          .substring(0, 11);


      if (valor.length <= 10) {

        valor =
          valor.replace(
            /^(\d{2})(\d)/,
            "($1) $2"
          );

        valor =
          valor.replace(
            /(\d{4})(\d)/,
            "$1-$2"
          );

      } else {

        valor =
          valor.replace(
            /^(\d{2})(\d)/,
            "($1) $2"
          );

        valor =
          valor.replace(
            /(\d{5})(\d)/,
            "$1-$2"
          );

      }

      this.value = valor;

    }
  );

</script>

</body>

</html>
