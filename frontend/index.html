<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HospTech | Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

  <div class="container">

    <div style="font-size: 55px; margin-bottom: 10px;">
      🏥
    </div>

    <h2>Sistema Hospitalar</h2>

    <p>
      Acesse o sistema para continuar
    </p>

    <input
      id="usuario"
      placeholder="Usuário"
      autocomplete="username"
    >

    <input
      id="senha"
      type="password"
      placeholder="Senha"
      autocomplete="current-password"
    >

    <button onclick="login()">
      Entrar
    </button>

    <div id="erro"></div>

  </div>

<script>

async function login() {

  const usuario =
    document.getElementById("usuario").value.trim();

  const senha =
    document.getElementById("senha").value;

  const erro =
    document.getElementById("erro");

  erro.innerHTML = "";

  if (!usuario || !senha) {

    erro.className = "vermelho";

    erro.innerText =
      "Informe usuário e senha.";

    return;
  }

  try {

    const response = await fetch("/login", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        usuario,
        senha
      })

    });

    const data = await response.json();

    if (!response.ok) {

      throw new Error(
        data.erro || "Erro ao realizar login."
      );

    }

    if (data.tipo === "triagem") {
      location.href = "triagem.html";
      return;
    }

    if (data.tipo === "medico") {
      location.href = "medico.html";
      return;
    }

    if (data.tipo === "atendimento") {
      location.href = "atendimento.html";
      return;
    }

    erro.className = "vermelho";

    erro.innerText =
      "Tipo de usuário não reconhecido.";

  } catch (error) {

    erro.className = "vermelho";

    erro.innerText = error.message;

  }

}

document
  .getElementById("senha")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {
      login();
    }

  });

</script>

</body>
</html>
