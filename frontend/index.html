<body>

  <div class="login-page">

```
<div class="container">

  <header>
    <h1>HospTech</h1>

    <p>
      Sistema Integrado de Atendimento Hospitalar
    </p>
  </header>

  <main>

    <section class="form-section">

      <div class="login-logo">
        🏥
      </div>

      <h2 class="login-title">
        Acesso ao Sistema
      </h2>

      <p class="login-subtitle">
        Entre com seu usuário e senha
      </p>

      <div class="form-group">

        <label for="usuario">

        </label>

        <input
          id="usuario"
          type="text"
          placeholder="Digite seu usuário"
          autocomplete="username"
        >

      </div>

      <div class="form-group">

        <label for="senha">
          Senha
        </label>

        <input
          id="senha"
          type="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
        >

        type="button"

```

  </div>

  <script>

    async function login() {

      const usuario = document
        .getElementById("usuario")
        .value
        .trim();

      const senha = document
        .getElementById("senha")
        .value
        .trim();

      const erro = document.getElementById("erro");
      const botao = document.querySelector(".login-button");

      // Limpa erro anterior
      erro.textContent = "";

      // Verifica campos
      if (!usuario || !senha) {
        erro.textContent = "Digite o usuário e a senha.";
        return;
      }

      // Evita vários cliques
      botao.disabled = true;
      botao.textContent = "Entrando...";

      try {

        const resposta = await fetch("/login", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            usuario: usuario,
            senha: senha
          })
        });

        const dados = await resposta.json();

        // Login inválido
        if (!resposta.ok || !dados.sucesso) {

          erro.textContent =
            dados.erro ||
            "Usuário ou senha incorretos.";

          return;
        }

        // Salva os dados do usuário
        localStorage.setItem(
          "usuario",
          dados.usuario
        );

        localStorage.setItem(
          "tipo",
          dados.tipo
        );

        // Redireciona conforme o tipo
        switch (dados.tipo) {

          case "triagem":
            window.location.href = "/triagem.html";
            break;

          case "medico":
            window.location.href = "/medico.html";
            break;

          case "atendimento":
            window.location.href = "/atendimento.html";
            break;

          default:
            erro.textContent =
              "Tipo de usuário não reconhecido.";

        }

      } catch (error) {

        console.error("Erro no login:", error);

        erro.textContent =
          "Não foi possível conectar ao servidor.";

      } finally {

        botao.disabled = false;
        botao.textContent = "Entrar no sistema";

      }

    }

  </script>

</body>

</html>
