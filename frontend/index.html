<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HospTech | Login</title>

  <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

  <div class="container">

    <div class="login-logo">
      🏥
    </div>

    <h2>HospTech</h2>

    <p class="login-subtitle">
      Sistema Integrado de Atendimento Hospitalar
    </p>

    <div class="form-group">

      <label for="usuario">
        Usuário
      </label>

      <input
        id="usuario"
        type="text"
        placeholder="Digite seu usuário"
        autocomplete="username"
      >

    </div>

    <div
      class="form-group"
      style="margin-top:16px;"
    >

      <label for="senha">
        Senha
      </label>

      <input
        id="senha"
        type="password"
        placeholder="Digite sua senha"
        autocomplete="current-password"
      >

    </div>

    <button onclick="login()">
      Entrar no sistema
    </button>

    <div id="erro"></div>

  </div>

<script>

async function login() {

  const usuario =
    document
      .getElementById("usuario")
      .value
      .trim();

  const senha =
    document
      .getElementById("senha")
      .value;

  const erro =
    document.getElementById("erro");

  erro.className = "";
  erro.innerText = "";

  if (!usuario || !senha) {

    erro.className = "vermelho";

    erro.innerText =
      "Informe usuário e senha.";

    return;
  }

  try {

    const response =
      await fetch("/login", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            usuario,
            senha
          })
      });

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.erro ||
        "Erro ao realizar login."
      );
    }

    if (data.tipo === "triagem") {

      location.href =
        "triagem.html";

      return;
    }

    if (data.tipo === "medico") {

      location.href =
        "medico.html";

      return;
    }

    if (data.tipo === "atendimento") {

      location.href =
        "atendimento.html";

      return;
    }

    erro.className = "vermelho";

    erro.innerText =
      "Tipo de usuário não reconhecido.";

  } catch (error) {

    erro.className = "vermelho";

    erro.innerText =
      error.message;
  }
}

document
  .getElementById("senha")
  .addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        login();
      }

    }
  );

</script>

</body>

</html>
