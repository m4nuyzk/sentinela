<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HospTech | Triagem</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<div class="container">

  <div class="page-header">

    <div class="page-title">

      <div class="page-title-icon">
        🏥
      </div>

      <div>

        <h2>Triagem hospitalar</h2>

        <p>
          Avaliação inicial e classificação de risco.
        </p>

      </div>

    </div>

    <button
      class="btn-abrir-tv"
      onclick="window.open('tv.html','_blank')"
    >
      📺 Abrir TV
    </button>

  </div>

  <!-- FILA -->

  <section class="pacientes-fila">

    <h3>

      Pacientes aguardando triagem

      <span>
        Chame o paciente pelo painel da TV
      </span>

    </h3>

    <div id="fila-pacientes">

      <div class="empty-state">
        Carregando pacientes...
      </div>

    </div>

    <button
      class="btn-secondary"
      onclick="carregarPacientes()"
    >
      🔄 Atualizar lista
    </button>

  </section>

  <!-- FORMULÁRIO -->

  <section class="form-section">

    <h3 class="form-section-title">

      <span>🩺</span>

      Avaliação do paciente

    </h3>

    <div class="form-grid">

      <div class="form-group">

        <label for="nome">
          Paciente
        </label>

        <input
          id="nome"
          placeholder="Nome do paciente"
        >

      </div>

      <div class="form-group">

        <label for="sintoma">
          Sintoma principal
        </label>

        <select id="sintoma">

          <option value="">
            Selecione o sintoma
          </option>

          <option value="dor_leve">
            Dor leve
          </option>

          <option value="resfriado">
            Resfriado
          </option>

          <option value="coriza">
            Coriza
          </option>

          <option value="tosse">
            Tosse
          </option>

          <option value="febre">
            Febre
          </option>

          <option value="vomito">
            Vômito
          </option>

          <option value="diarreia">
            Diarreia
          </option>

          <option value="falta_ar_moderada">
            Falta de ar moderada
          </option>

          <option value="falta_ar_grave">
            Falta de ar grave
          </option>

          <option value="infarto">
            Suspeita de infarto
          </option>

          <option value="avc">
            Suspeita de AVC
          </option>

          <option value="convulsao">
            Convulsão
          </option>

          <option value="hemorragia">
            Hemorragia
          </option>

        </select>

      </div>

      <div class="form-group">

        <label for="temp">
          Temperatura
        </label>

        <input
          id="temp"
          type="number"
          step="0.1"
          placeholder="Ex.: 36.5"
        >

      </div>

      <div class="form-group">

        <label for="alergia">
          Alergias
        </label>

        <input
          id="alergia"
          placeholder="Informe alergias conhecidas"
        >

      </div>

      <div class="form-group full">

        <label for="observacao">
          Observações
        </label>

        <textarea
          id="observacao"
          placeholder="Informações adicionais..."
        ></textarea>

      </div>

    </div>

  </section>

  <div id="resultado"></div>

  <button onclick="salvar()">
    Salvar triagem e encaminhar
  </button>

</div>

<script>

let pacientesAtuais = [];

async function carregarPacientes() {

  const div =
    document.getElementById(
      "fila-pacientes"
    );

  try {

    const response =
      await fetch("/pacientes");

    const pacientes =
      await response.json();

    pacientesAtuais =
      pacientes;

    const fila =
      pacientes.filter(
        p =>
          p.status ===
          "triagem"
      );

    if (
      fila.length === 0
    ) {

      div.innerHTML = `
        <div class="empty-state">
          Nenhum paciente aguardando triagem.
        </div>
      `;

      return;
    }

    div.innerHTML = "";

    fila.forEach(p => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "fila-item";

      item.innerHTML = `

        <div>

          <strong>
            ${escapeHTML(p.nome)}
          </strong>

          <br>

          <small>
            CPF:
            ${escapeHTML(
              p.cpf || "—"
            )}
            &nbsp;•&nbsp;
            ${escapeHTML(
              p.tipo || "—"
            )}
          </small>

        </div>

        <button
          class="btn-tv"
          onclick="chamarNaTV('${escapeJS(p.nome)}')"
        >
          📺 Chamar na TV
        </button>

      `;

      div.appendChild(
        item
      );

    });

  } catch (error) {

    div.innerHTML = `
      <div class="vermelho">
        Erro ao carregar pacientes.
      </div>
    `;
  }
}

async function chamarNaTV(nome) {

  try {

    const response =
      await fetch(
        "/tv/chamar",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              localTipo:
                "GUICHÊ",

              localNumero:
                "01",

              paciente:
                nome
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.erro ||
        "Erro ao chamar paciente."
      );
    }

    alert(
      `${nome} foi chamado para o Guichê 01.`
    );

  } catch (error) {

    alert(
      error.message
    );
  }
}

function classificarRisco(
  sintoma,
  temperatura
) {

  const vermelhos = [
    "infarto",
    "avc",
    "convulsao",
    "hemorragia",
    "falta_ar_grave"
  ];

  const amarelos = [
    "febre",
    "vomito",
    "diarreia",
    "falta_ar_moderada"
  ];

  if (
    temperatura >= 39
  ) {
    return "vermelho";
  }

  if (
    vermelhos.includes(
      sintoma
    )
  ) {
    return "vermelho";
  }

  if (
    temperatura >= 38 ||
    amarelos.includes(
      sintoma
    )
  ) {
    return "amarelo";
  }

  return "verde";
}

async function salvar() {

  const nome =
    document
      .getElementById("nome")
      .value
      .trim();

  const sintoma =
    document
      .getElementById("sintoma")
      .value;

  const temperatura =
    Number(
      document
        .getElementById("temp")
        .value
    );

  const alergia =
    document
      .getElementById("alergia")
      .value
      .trim();

  const observacao =
    document
      .getElementById("observacao")
      .value
      .trim();

  const resultado =
    document.getElementById(
      "resultado"
    );

  resultado.className = "";
  resultado.innerText = "";

  if (
    !nome ||
    !sintoma
  ) {

    resultado.className =
      "vermelho";

    resultado.innerText =
      "Informe o paciente e selecione o sintoma.";

    return;
  }

  const risco =
    classificarRisco(
      sintoma,
      temperatura
    );

  try {

    const response =
      await fetch(
        "/triagem",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              nome,

              sintoma,

              temperatura:
                isNaN(temperatura)
                  ? ""
                  : temperatura,

              alergia,

              observacao,

              risco
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.erro ||
        "Erro ao salvar triagem."
      );
    }

    resultado.className =
      risco;

    resultado.innerText =
      `Classificação de risco: ${risco.toUpperCase()}`;

    document.getElementById(
      "nome"
    ).value = "";

    document.getElementById(
      "sintoma"
    ).value = "";

    document.getElementById(
      "temp"
    ).value = "";

    document.getElementById(
      "alergia"
    ).value = "";

    document.getElementById(
      "observacao"
    ).value = "";

    carregarPacientes();

  } catch (error) {

    resultado.className =
      "vermelho";

    resultado.innerText =
      error.message;
  }
}

function escapeHTML(value) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

function escapeJS(value) {

  return String(value)
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    )
    .replaceAll(
      "\n",
      "\\n"
    )
    .replaceAll(
      "\r",
      "\\r"
    );
}

carregarPacientes();

setInterval(
  carregarPacientes,
  10000
);

</script>

</body>

</html>
