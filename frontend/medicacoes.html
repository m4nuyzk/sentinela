<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HospTech | Medicações</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<div class="container">

  <div class="page-header">

    <div class="page-title">

      <div class="page-title-icon">
        💊
      </div>

      <div>

        <h2>Medicações prescritas</h2>

        <p>
          Histórico das prescrições realizadas durante as consultas.
        </p>

      </div>

    </div>

  </div>

  <div id="listaMedicacoes">

    <div class="empty-state">
      Carregando histórico...
    </div>

  </div>

</div>

<script>

async function carregarMedicacoesPrescritas() {

  const div =
    document.getElementById(
      "listaMedicacoes"
    );

  try {

    const response =
      await fetch(
        "/medicacoes"
      );

    const data =
      await response.json();

    div.innerHTML = "";

    if (
      data.length === 0
    ) {

      div.innerHTML = `
        <div class="card">

          <div class="medication-icon">
            💊
          </div>

          <p>
            Nenhuma medicação prescrita ainda.
          </p>

        </div>
      `;

      return;
    }

    data
      .slice()
      .reverse()
      .forEach(c => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "card";

        card.innerHTML = `

          <div class="medication-icon">
            💊
          </div>

          <h3>
            ${escapeHTML(
              c.paciente ||
              "Paciente não informado"
            )}
          </h3>

          <p>
            <strong>
              Medicação
            </strong><br>

            ${escapeHTML(
              c.medicacao ||
              "Não informada"
            )}
          </p>

          <p>
            <strong>
              Diagnóstico
            </strong><br>

            ${escapeHTML(
              c.diagnostico ||
              "Não informado"
            )}
          </p>

          <p>
            <strong>
              Observações
            </strong><br>

            ${escapeHTML(
              c.obs ||
              "Nenhuma observação."
            )}
          </p>

        `;

        div.appendChild(
          card
        );
      });

  } catch (error) {

    div.innerHTML = `
      <div class="vermelho">
        Erro ao carregar o histórico de medicações.
      </div>
    `;
  }
}

function escapeHTML(value) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

carregarMedicacoesPrescritas();

setInterval(
  carregarMedicacoesPrescritas,
  10000
);

</script>

</body>

</html>
