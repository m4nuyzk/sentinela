<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HospTech | Medicações</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

  <h2>
    💊 Medicações Prescritas
  </h2>

  <p>
    Histórico de medicações prescritas durante as consultas.
  </p>

  <div id="listaMedicacoes">

    <p>
      Carregando...
    </p>

  </div>

</div>

<script>

async function carregarMedicacoesPrescritas() {

  const div =
    document.getElementById(
      "listaMedicacoes"
    );

  try {

    const response =
      await fetch("/medicacoes");

    const data =
      await response.json();

    div.innerHTML = "";

    if (data.length === 0) {

      div.innerHTML = `
        <div class="card">
          <p>
            Nenhuma medicação prescrita ainda.
          </p>
        </div>
      `;

      return;
    }

    data.forEach(c => {

      const card =
        document.createElement("div");

      card.className = "card";

      card.innerHTML = `

        <h3>
          👤 ${escapeHTML(c.paciente)}
        </h3>

        <p>
          <b>💊 Medicação:</b>
          ${escapeHTML(c.medicacao)}
        </p>

        <p>
          <b>🩺 Diagnóstico:</b>
          ${escapeHTML(c.diagnostico)}
        </p>

        <p>
          <b>📝 Observações:</b>
          ${escapeHTML(
            c.obs || "Nenhuma"
          )}
        </p>

      `;

      div.appendChild(card);

    });

  } catch (error) {

    div.innerHTML = `
      <div class="card">
        <p style="color:#f87171;">
          Erro ao carregar medicações.
        </p>
      </div>
    `;

  }

}

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

carregarMedicacoesPrescritas();

setInterval(
  carregarMedicacoesPrescritas,
  10000
);

</script>

</body>
</html>
