<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HospTech | Painel de Chamadas</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eef4fb,
          #f8fafc
        );

      color: #172033;

      overflow: hidden;
    }

    .tv-container {

      width: 94vw;

      height: 90vh;

      margin: 5vh auto;

      display: grid;

      grid-template-columns:
        30% 70%;

      gap: 18px;
    }

    .left-panel,
    .right-panel {

      display: flex;

      flex-direction: column;

      gap: 18px;
    }

    .box {

      background: white;

      border: 1px solid #dbe4ef;

      border-radius: 22px;

      box-shadow:
        0 15px 40px
        rgba(15, 23, 42, .08);

      overflow: hidden;
    }

    /* =====================================
       LOCAL
    ===================================== */

    .local-box {

      flex: 1;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      background:
        linear-gradient(
          145deg,
          #eff6ff,
          #ffffff
        );
    }

    .box-title {

      color: #64748b;

      font-size: 1.4vw;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: 2px;

      margin-bottom: 15px;
    }

    .local-type {

      color: #2563eb;

      font-size: 2vw;

      font-weight: 800;
    }

    .local-number {

      margin-top: 10px;

      color: #172033;

      font-size: 8vw;

      font-weight: 900;

      line-height: 1;
    }

    /* =====================================
       HISTÓRICO
    ===================================== */

    .history-box {

      flex: 1.2;

      padding: 25px;
    }

    .history-box .box-title {

      text-align: center;

      font-size: 1.2vw;

      margin-bottom: 20px;
    }

    #history-list {

      list-style: none;

      padding: 0;

      margin: 0;

      width: 100%;
    }

    #history-list li {

      padding: 13px 0;

      border-bottom:
        1px solid #e2e8f0;

      color: #475569;

      font-size: 1.1vw;

      font-weight: 700;
    }

    /* =====================================
       PACIENTE
    ===================================== */

    .patient-box {

      flex: 3;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 30px;

      border-top:
        8px solid #2563eb;
    }

    .patient-box .box-title {

      color: #64748b;

      font-size: 1.5vw;
    }

    .patient-name {

      max-width: 90%;

      color: #172033;

      font-size: 5.5vw;

      font-weight: 900;

      line-height: 1.1;

      word-break: break-word;
    }

    .patient-message {

      margin-top: 25px;

      padding: 12px 20px;

      border-radius: 999px;

      background: #eff6ff;

      color: #2563eb;

      font-size: 1.3vw;

      font-weight: 800;
    }

    /* =====================================
       LOGO
    ===================================== */

    .logo-box {

      flex: .8;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #7c3aed
        );

      color: white;

      border: none;
    }

    .logo-text {

      font-size: 2.4vw;

      font-weight: 900;

      letter-spacing: 1px;
    }

    /* =====================================
       ANIMAÇÃO
    ===================================== */

    @keyframes chamada {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.015);
      }

      100% {
        transform: scale(1);
      }
    }

    .flash {

      animation:
        chamada .5s ease 4;

      box-shadow:
        0 0 0 5px
        rgba(37, 99, 235, .15),
        0 20px 50px
        rgba(37, 99, 235, .15);
    }

    /* =====================================
       RESPONSIVO
    ===================================== */

    @media (max-width: 900px) {

      .tv-container {

        width: 96vw;

        height: 94vh;

        margin: 3vh auto;

        gap: 10px;
      }

      .box {

        border-radius: 16px;
      }

      .patient-name {

        font-size: 7vw;
      }

      .box-title {

        font-size: 2.5vw;
      }

      .history-box .box-title {

        font-size: 2.2vw;
      }

      #history-list li {

        font-size: 1.8vw;
      }

      .patient-message {

        font-size: 2vw;
      }

      .logo-text {

        font-size: 3.5vw;
      }
    }

  </style>

</head>

<body>

<div class="tv-container">

  <div class="left-panel">

    <div class="box local-box">

      <div class="box-title">
        Atendimento
      </div>

      <div
        class="local-type"
        id="local-tipo"
      >
        GUICHÊ
      </div>

      <div
        class="local-number"
        id="local-numero"
      >
        --
      </div>

    </div>

    <div class="box history-box">

      <div class="box-title">
        Últimas chamadas
      </div>

      <ul id="history-list"></ul>

    </div>

  </div>

  <div class="right-panel">

    <div class="box patient-box">

      <div class="box-title">
        Paciente
      </div>

      <div
        class="patient-name"
        id="patient-name"
      >
        AGUARDANDO...
      </div>

      <div class="patient-message">
        Aguarde o atendimento
      </div>

    </div>

    <div class="box logo-box">

      <div class="logo-text">
        🏥 HospTech
      </div>

    </div>

  </div>

</div>

<script>

let ultimoId = null;

async function atualizar() {

  try {

    const response =
      await fetch(
        "/tv/chamada"
      );

    const data =
      await response.json();

    const chamada =
      data.chamada;

    const historico =
      data.historico || [];

    if (chamada) {

      document.getElementById(
        "local-tipo"
      ).innerText =
        chamada.localTipo ||
        "GUICHÊ";

      document.getElementById(
        "local-numero"
      ).innerText =
        chamada.localNumero ||
        "--";

      document.getElementById(
        "patient-name"
      ).innerText =
        chamada.paciente ||
        "AGUARDANDO...";

      if (
        chamada.id !==
        ultimoId
      ) {

        ultimoId =
          chamada.id;

        const patientBox =
          document.querySelector(
            ".patient-box"
          );

        patientBox.classList.remove(
          "flash"
        );

        void patientBox.offsetWidth;

        patientBox.classList.add(
          "flash"
        );
      }
    }

    const list =
      document.getElementById(
        "history-list"
      );

    list.innerHTML = "";

    historico
      .slice(0, 5)
      .forEach(h => {

        const li =
          document.createElement(
            "li"
          );

        li.innerText =
          `${h.localTipo || "GUICHÊ"} ${h.localNumero || ""} — ${h.paciente}`;

        list.appendChild(
          li
        );
      });

  } catch (error) {

    console.error(
      "Erro ao buscar chamada:",
      error
    );
  }
}

atualizar();

setInterval(
  atualizar,
  2000
);

</script>

</body>

</html>
